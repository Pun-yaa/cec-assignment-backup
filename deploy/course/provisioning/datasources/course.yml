apiVersion: 1
datasources:
  - name: Course Prometheus
    uid: course-prometheus
    type: prometheus
    access: proxy
    url: http://course-prometheus:9090
    isDefault: true
    editable: false
  - name: Course PostgreSQL
    uid: course-postgres
    type: grafana-postgresql-datasource
    url: course-db:5432
    user: course
    jsonData:
      database: course
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: course-local
    editable: false
