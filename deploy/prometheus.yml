global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: data
    static_configs:
      - targets: [data:8000]
  - job_name: scheduler
    static_configs:
      - targets: [scheduler:8000]
  - job_name: notification
    static_configs:
      - targets: [notification:8000]
  - job_name: executor
    dns_sd_configs:
      - names: [executor]
        type: A
        port: 8000
        refresh_interval: 5s
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
